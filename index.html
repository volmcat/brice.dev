<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crow or Raven?</title>
  <style>
    @keyframes crowPop {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      color: #333;
    }
    .upload-box {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    input[type="file"] {
      margin-top: 1rem;
    }
    #result {
      margin-top: 2rem;
      font-size: 2rem;
      color: #e74c3c;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    }
    .animated {
      animation: crowPop 0.6s ease;
    }
    .spinner {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    #spinnerContainer {
      display: none;
    }
  </style>
</head>
<body>
  <div class="upload-box">
    <h1>Crow or Raven?</h1>
    <p>Upload a picture of a bird and we’ll tell you what it is.</p>
    <input type="file" id="birdImage" accept="image/*" />
    <div id="spinnerContainer"><div class="spinner"></div></div>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById('birdImage').addEventListener('change', function() {
      const resultDiv = document.getElementById('result');
      const spinnerContainer = document.getElementById('spinnerContainer');

      resultDiv.textContent = '';
      spinnerContainer.style.display = 'block';

      if (this.files && this.files[0]) {
        setTimeout(() => {
          spinnerContainer.style.display = 'none';
          resultDiv.textContent = 'That’s a crow!';
          resultDiv.classList.remove('animated');
          void resultDiv.offsetWidth; // trigger reflow for animation restart
          resultDiv.classList.add('animated');
        }, 5000); // simulate 5 second processing
      }
    });
  </script>
</body>
</html>
